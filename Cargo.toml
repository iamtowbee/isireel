[package]
name = "isireel-ai-trainer"
version = "1.0.0"
edition = "2021"
authors = ["AI Trainer Team"]
description = "Mobile AI Training Engine with OpenAI Integration"

[lib]
name = "ai_trainer"
crate-type = ["cdylib", "rlib"]

[dependencies]
# OpenAI and HTTP
reqwest = { version = "0.11", features = ["json", "blocking"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Python FFI
pyo3 = { version = "0.20", features = ["extension-module"] }

# Async runtime
async-trait = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"

[dev-dependencies]
mockito = "1.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
