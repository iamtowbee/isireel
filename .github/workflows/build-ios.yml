name: Build iOS App

on:
  push:
    branches: [ main, claude/* ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Add iOS targets
      run: |
        rustup target add aarch64-apple-ios
        rustup target add x86_64-apple-ios
        rustup target add aarch64-apple-ios-sim

    - name: Install Node dependencies
      run: npm install

    - name: Build Rust library for iOS
      run: |
        echo "Building Rust for iOS device..."
        cargo build --release --target aarch64-apple-ios

        echo "Building Rust for iOS simulator..."
        cargo build --release --target x86_64-apple-ios
        cargo build --release --target aarch64-apple-ios-sim

    - name: Create XCFramework
      run: |
        mkdir -p target/universal-sim/release
        lipo -create \
          target/x86_64-apple-ios/release/libai_trainer.a \
          target/aarch64-apple-ios-sim/release/libai_trainer.a \
          -output target/universal-sim/release/libai_trainer.a

        rm -rf ios/AITrainer.xcframework
        xcodebuild -create-xcframework \
          -library target/aarch64-apple-ios/release/libai_trainer.a \
          -headers ios \
          -library target/universal-sim/release/libai_trainer.a \
          -headers ios \
          -output ios/AITrainer.xcframework

    - name: Install CocoaPods
      run: |
        gem install cocoapods
        cd ios
        pod install || pod install --repo-update
        cd ..

    - name: Setup Xcode project
      run: |
        # Use React Native to initialize iOS project if needed
        npx react-native upgrade --legacy true || true

    - name: Build app with xcodebuild
      run: |
        # Find the workspace
        WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)

        if [ -z "$WORKSPACE" ]; then
          echo "No workspace found, using xcodeproj..."
          PROJECT=$(find ios -name "*.xcodeproj" | head -n 1)

          xcodebuild -project "$PROJECT" \
            -scheme AITrainerTerminal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/AITrainerTerminal.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
        else
          xcodebuild -workspace "$WORKSPACE" \
            -scheme AITrainerTerminal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/AITrainerTerminal.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
        fi

    - name: Create IPA
      run: |
        mkdir -p build/Payload
        cp -r build/AITrainerTerminal.xcarchive/Products/Applications/*.app build/Payload/
        cd build
        zip -r AITrainerTerminal.ipa Payload
        cd ..

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v3
      with:
        name: AITrainerTerminal-iOS
        path: build/AITrainerTerminal.ipa
        retention-days: 30

    - name: Send IPA to Telegram
      if: success()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "Telegram secrets not set. Skipping Telegram notification."
          exit 0
        fi

        IPA_FILE="build/AITrainerTerminal.ipa"
        FILE_SIZE=$(ls -lh "$IPA_FILE" | awk '{print $5}')
        COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
        COMMIT_SHA=$(git rev-parse --short HEAD)
        BRANCH_NAME=${GITHUB_REF#refs/heads/}

        curl -F "chat_id=$TELEGRAM_CHAT_ID" \
             -F "document=@$IPA_FILE" \
             -F "caption=🎉 New iOS Build Ready!

📱 App: AI Training Terminal
💾 Size: $FILE_SIZE
🌿 Branch: $BRANCH_NAME
🔖 Commit: $COMMIT_SHA

📝 $COMMIT_MSG

✅ Download and install with AltStore!" \
             "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"
