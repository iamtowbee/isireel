name: Build iOS App

on:
  push:
    branches: [ main, claude/* ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Add iOS targets
      run: |
        rustup target add aarch64-apple-ios
        rustup target add x86_64-apple-ios
        rustup target add aarch64-apple-ios-sim

    - name: Install dependencies
      run: npm install

    - name: Build Rust library
      run: |
        cargo build --release --target aarch64-apple-ios
        cargo build --release --target x86_64-apple-ios
        cargo build --release --target aarch64-apple-ios-sim

    - name: Create XCFramework
      run: |
        mkdir -p target/universal-sim/release
        lipo -create target/x86_64-apple-ios/release/libai_trainer.a target/aarch64-apple-ios-sim/release/libai_trainer.a -output target/universal-sim/release/libai_trainer.a
        rm -rf ios/AITrainer.xcframework
        xcodebuild -create-xcframework -library target/aarch64-apple-ios/release/libai_trainer.a -headers ios -library target/universal-sim/release/libai_trainer.a -headers ios -output ios/AITrainer.xcframework

    - name: Install CocoaPods
      run: cd ios && pod install

    - name: Build iOS app
      run: |
        cd ios
        xcodebuild -project AITrainerTerminal.xcodeproj -scheme AITrainerTerminal -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath ../build/AITrainerTerminal.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO || echo "Build may have warnings"

    - name: Create IPA
      run: |
        mkdir -p build/Payload
        cp -r build/AITrainerTerminal.xcarchive/Products/Applications/*.app build/Payload/ || echo "App not found in expected location"
        cd build && zip -r AITrainerTerminal.ipa Payload

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AITrainerTerminal-iOS
        path: build/AITrainerTerminal.ipa

    - name: Send to Telegram
      if: success()
      env:
        BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ -n "$BOT_TOKEN" ] && [ -n "$CHAT_ID" ]; then
          curl -F chat_id="$CHAT_ID" -F document=@build/AITrainerTerminal.ipa -F caption="New iOS build ready! Download and install with AltStore" "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
        fi
